{% extends 'core/base.html' %}
{% block title %}Verify — SquadTurf{% endblock %}
{% block content %}
<div class="st st-narrow" style="margin-top:24px">
  <h1 class="st-title" style="font-size:32px">Enter your code</h1>
  <p class="st-sub">We sent a 6-digit code to {{ masked_phone }}.</p>
  <form method="post" class="st-form-card" style="margin-top:18px">
    {% csrf_token %}
    <label class="st-field"><span>Code</span>{{ form.code }}</label>
    {% for e in form.code.errors %}<p class="st-err" style="text-align:center">{{ e }}</p>{% endfor %}
    <button class="st-btn st-btn-block st-btn-lg" type="submit" style="margin-top:8px">Verify</button>
  </form>
  <p class="st-sub" style="text-align:center;margin-top:16px">No code? <a class="st-link" href="{% url 'resend_otp' %}">Resend</a></p>
</div>
{% endblock %}
