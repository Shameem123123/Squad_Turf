{% extends 'core/base.html' %}
{% block title %}Turf console — SquadTurf{% endblock %}
{% block content %}
<div class="st">
  <p class="st-eyebrow">Turf console</p>
  <h1 class="st-title">Choose a turf</h1>
  <div class="st-list">
    {% for t in turfs %}<a class="st-item" href="{% url 'manage_schedule' t.slug %}"><h3>{{ t.name }}</h3><p class="st-muted">{{ t.location_name }}</p></a>
    {% empty %}<div class="st-empty"><b>No turfs yet.</b>Enable booking for a turf in the admin site.</div>{% endfor %}
  </div>
</div>
{% endblock %}
