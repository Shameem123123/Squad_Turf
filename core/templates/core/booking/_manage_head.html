{% load booking_tags core_extras %}
<div class="st-row" style="align-items:flex-start">
  <div>
    <p class="st-eyebrow">Turf console</p>
    <h1 class="st-title" style="font-size:clamp(26px,5vw,34px)">{{ turf.name }}</h1>
    <p class="st-sub" style="margin-top:2px">{{ turf.location_name }}</p>
  </div>
  <span class="st-live" style="margin-top:6px"><i></i><span id="st-live-time">Live</span></span>
</div>
<div class="st-actions" style="margin-top:8px">
  <a class="st-btn st-btn-soft st-btn-sm" href="{% url 'book_turf' turf.slug %}">Public page</a>
  {% if managed_turfs|length > 1 or user.is_superuser %}<a class="st-btn st-btn-soft st-btn-sm" href="{% url 'manage_home' %}?all=1">Switch turf</a>{% endif %}
</div>
