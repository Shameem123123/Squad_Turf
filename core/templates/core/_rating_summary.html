{% if profile.rating_count %}
  <span class="st-tag" title="Average play rating">★ {{ profile.average_rating }}</span>
  {% if profile.reliability_pct is not None %}<span class="st-tag" title="Showed up as planned">{{ profile.reliability_pct }}% showed up</span>{% endif %}
{% else %}
  <span class="st-tag">New player</span>
{% endif %}
